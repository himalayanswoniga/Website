# Single source of truth for the deploy. The Netlify site's "Base directory" setting must
# be EMPTY (repo root) for this file to be read — see README "Frontend + API — Netlify".
[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# The Express API runs as one function on the site's own origin. That is what removes the
# separate API host, the CORS allowlist, and the VITE_API_BASE_URL the frontend used to need.
#
# /api/v1/products -> /.netlify/functions/api/api/v1/products, and the function strips its
# own mount prefix so Express sees /api/v1/products again.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

# SPA fallback for React Router. Declared last so it never shadows the API routes above.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.deploy-preview]
  command = "npm run build"

[context.production]
  command = "npm run build"
